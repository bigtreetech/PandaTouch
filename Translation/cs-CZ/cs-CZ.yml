  mqtt_login_failed: |
    Nelze se připojit k tiskárně!
    "Přístupový kód" může být špatně. Klikněte na tlačítko "Editovat" pro jeho kontrolu a nastavení.
    Chcete-li vyřešit problémy s připojením, naskenujte QR kód.
  mqtt_never_connected: |
    Nelze se připojit k tiskárně!
    Ujistěte se, že tiskárna je zapnuta a připojena na stejné síti jako Panda Touch. Nebo klikněte na tlačítko "Editovat" a změňte "IP" a "Výrobní číslo".
    Chcete-li vyřešit problémy s připojením, naskenujte QR kód.
  mqtt_master_changed: |
    Nelze se připojit k tiskárně!
    Ujistěte se, že tiskárna je zapnuta a připojena na stejné síti jako Panda Touch. Nebo klikněte na tlačítko "Editovat" a změňte "IP" a "Výrobní číslo".
    Jelikož toto je "Hlavní" tiskárna, jiná tiskárna ve skupině bude dočasně nastavena jako "Hlavní".
    Pokud jste tiskárnu vypnuli, ignorujte tuto zprávu.
    Chcete-li vyřešit problémy s připojením, naskenujte QR kód.
  mqtt_master_error: |
    Nelze se připojit k tiskárně!
    Ujistěte se, že tiskárna je zapnuta a připojena na stejné síti jako Panda Touch. Nebo klikněte na tlačítko "Editovat" a změňte "IP" a "Výrobní číslo".
    Jelikož toto je "Hlavní" tiskárna a ve skupině nejsou jiné tiskárny, nemůžete dočasně používat Panda Touch, dokud toto nebude vyřešeno.
    Chcete-li vyřešit problémy s připojením, naskenujte QR kód.
  mqtt_slave: |
    Nelze se připojit k tiskárně!
    Ujistěte se, že tiskárna je zapnuta a připojena na stejné síti jako Panda Touch. Nebo klikněte na tlačítko "Editovat" a změňte "IP" a "Výrobní číslo".
    Jelikož toto není "Hlavní" tiskárna, nebude dostupná ani schopná řídit se "Hlavní" tiskárnou, dokud bude ve skupině.
    Pokud jste tiskárnu vypnuli, ignorujte tuto zprávu.
    Chcete-li vyřešit problémy s připojením, naskenujte QR kód.
  mqtt_not_online: |
    Nelze se připojit k tiskárně!
    Ujistěte se, že tiskárna je zapnuta a připojena na stejné síti jako Panda Touch.
    Chcete-li vyřešit problémy s připojením, naskenujte QR kód.
