  tip_firmware_incompatible: |
   Vaše tiskárna Bambu používá verzi firmwaru %s nebo vyšší.
   Tento firmware zavádí ověřovací mechanismus, který v cloudovém režimu vyžaduje schválení od Bambu pro odesílání ovládacích příkazů do vašich tiskáren.
   Chcete-li znovu získat plnou kontrolu nad tiskárnou pomocí Panda Touch, přepněte na původní obrazovce Bambu do režimu Pouze LAN (LAN-only) a režimu vývojáře (developer mode).
   Případně se můžete vrátit ke starší verzi firmwaru pomocí aplikace Bambu Handy.
  tip_firmware_incompatible_reduced: 'Režim pouze pro čtení. Pro plné ovládání přepněte na LAN-only developer mode nebo vraťte firmware tiskárny na starší verzi.'
