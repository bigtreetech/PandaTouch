  00x1A00010000020021: 'Zjištěna abnormalita při ukládání hotendu do slotu %s: na tiskové hlavě nebyl detekován žádný hotend. Před kliknutím na „Pokračovat“ nasaďte hotend na tiskovou hlavu.'
  00x1A00010000020022: 'Zjištěna abnormalita při ukládání hotendu do slotu %s. Před kliknutím na „Pokračovat“ se ujistěte, že na tiskové hlavě není žádný hotend a že ve slotu %s v zásobníku je hotend přítomen.'
  00x1A00010000020023: 'Zjištěna abnormalita při ukládání hotendu do slotu %s: zásobník nedokázal detekovat hotend na tiskové hlavě. Zkontrolujte, zda na povrchu chladiče hotendu nejsou nečistoty nebo zda nevypadl přední magnet. Jinak zásobník indukčních hotendů rekalibrujte.'
  00x1A00010000020024: 'Zjištěna abnormalita při ukládání hotendu do slotu %s: zásobníku se nepodařilo odpojit hotend od tiskové hlavy. Ujistěte se, že zajišťovací páčka je v uvolněné poloze.'
  00x1A00010000020025: 'Zjištěna abnormalita při ukládání hotendu do slotu %s: hotend vypadl. Zkontrolujte, zda v horní části hotendu nezůstalo příliš mnoho filamentu, zbytky odstřihněte, vložte hotend zpět do slotu %s v zásobníku a klikněte na „Pokračovat“.'
  00x1A00010000020026: 'Zjištěna abnormalita při ukládání hotendu do slotu %s: pohyb zásobníku je blokován. Zkontrolujte, zda v cestě nejsou cizí předměty, odstraňte je a klikněte na „Pokračovat“.'
  00x1A00010000020027: 'Zjištěna abnormalita při ukládání hotendu do slotu %s: opakovaný pokus o vystředění tiskové hlavy selhal. Přesuňte tiskovou hlavu ručně do středu tiskové podložky a klikněte na „Pokračovat“.'
  00x1A00010000020030: 'Zjištěna abnormalita při vyzvedávání hotendu ze slotu %s: na této pozici nebyl nalezen žádný hotend. Před kliknutím na „Pokračovat“ vložte hotend do příslušného slotu.'
  00x1A00010000020031: 'Zjištěna abnormalita při vyzvedávání hotendu ze slotu %s: na tiskové hlavě je již namontován hotend. Před kliknutím na „Pokračovat“ jej z tiskové hlavy sejměte.'
  00x1A00010000020032: 'Zjištěna chyba při vyzvedávání hotendu ze slotu %s: tisková hlava nedokázala detekovat hotend v zásobníku. Zkontrolujte, zda v montážním slotu indukčního hotendu na tiskové hlavě nejsou nečistoty. Pokud ne, zásobník rekalibrujte.'
  00x1A00010000020033: 'Zjištěna chyba při vyzvedávání hotendu ze slotu %s: zásobníku se nepodařilo hotend správně nasadit. Zkontrolujte zbytky filamentu v horní části hotendu, nečistoty v kontaktní ploše nebo zda je zajišťovací páčka uvolněná. Poté klikněte na „Pokračovat“.'
  00x1A00010000020034: 'Zjištěna chyba při vyzvedávání hotendu ze slotu %s: hotend vypadl. Zkontrolujte a odstraňte zbytky filamentu či nečistoty v horní části hotendu, vložte jej zpět do slotu %s v zásobníku a klikněte na „Pokračovat“.'
  00x1A00010000020035: 'Zjištěna chyba při vyzvedávání hotendu ze slotu %s: pohyb zásobníku je blokován. Odstraňte případné cizí předměty a klikněte na „Pokračovat“.'
  00x1A00010000020036: 'Zjištěna chyba při vyzvedávání hotendu ze slotu %s: opakovaný pokus o vystředění tiskové hlavy selhal. Přesuňte tiskovou hlavu ručně do středu tiskové podložky a klikněte na „Pokračovat“.'
  00x1A00100000020001: 'Osa XY tiskové hlavy nebo zásobník hotendů nedokončily navádění (homing). Výměna hotendu nemůže pokračovat.'
  00x1A00110000020002: 'Hrubé navádění zásobníku hotendů selhalo. Zkontrolujte prosím, zda v cestě nejsou překážky.'
  00x1A00110000020003: 'Hrubé navádění zásobníku indukčních hotendů selhalo kvůli nadměrné dráze pohybu. Zkontrolujte prosím stav rozvodového řemene.'
  00x1A00120000020001: 'Kalibrace zásobníku indukčních hotendů selhala: chyba kalibrace polohy kamery. Očistěte nečistoty z povrchu termopapíru v zadní části tiskové podložky a odstraňte zbytky z trysky.'
  00x1A00120000020002: 'Kalibrace zásobníku indukčních hotendů selhala: nebyla detekována bílá značka na dokovacím modulu zásobníku. Podle pokynů na Wiki zkontrolujte, zda není značka poškozená nebo znečištěná.'
  00x1A00120000020003: 'Kalibrace zásobníku indukčních hotendů selhala: abnormální výsledek kalibrace. Podle pokynů na Wiki zkontrolujte, zda není konstrukce zásobníku deformovaná.'
  00x1A00120000020004: 'Kalibrace výšky zásobníku hotendů je abnormální. Zkontrolujte, zda zásobník neblokují cizí předměty.'
  00x1A00120000020007: 'Vypršel časový limit pohybu zásobníku hotendů. Zkontrolujte, zda zásobník neblokují cizí předměty nebo překážky.'
  00x1A00120000020008: 'Poloha zajišťovací tyče nástroje v zásobníku hotendů je abnormální. Zkontrolujte, zda zajišťovací tyč neblokují cizí předměty nebo překážky.'
  00x1A00120000020009: 'Chyba zajišťovací páčky indukčního hotendu nebo uvolňovacího mechanismu páčky zásobníku. Pro kontrolu nahlédněte na Wiki.'
  00x1A00120000020010: 'Zásobník indukčních hotendů nebyl nastaven. Před použitím jeho funkcí dokončete nastavení podle pokynů.'
  00x1A00120000020011: 'Před zajištěním nebyl detekován indukční hotend. Zkontrolujte prosím jeho instalaci na tiskové hlavě.'
  00x1A00130000020001: 'Zásobník hotendů je zcela obsazen. Před pokračováním vyjměte alespoň jeden hotend.'
  00x1A00200000020001: 'Během výměny hotendu došlo k výpadku napájení. Obnovte nastavení podle průvodce na Wiki, jinak může tisk selhat.'
  00x1A00210000010001: 'Během vyzvedávání/ukládání hotendu došlo k výpadku napájení. Vložte hotend zpět do slotu %s v zásobníku a přesuňte tiskovou hlavu do středu tiskové podložky.'
  00x1A00210000010002: 'Během vyzvedávání/ukládání hotendu došlo k výpadku napájení. Nasaďte hotend ze slotu %s v zásobníku zpět na tiskovou hlavu a přesuňte tiskovou hlavu do středu tiskové podložky.'
  00x1A00210000020001: 'Během vyzvedávání/ukládání hotendu došlo k výpadku napájení. Zkontrolujte, zda je hotend ve slotu %s v zásobníku. Pokud ne, vložte jej tam zpět a přesuňte tiskovou hlavu do středu podložky.'
  00x1A00210000020002: 'Během vyzvedávání/ukládání hotendu došlo k výpadku napájení. Zkontrolujte, zda je hotend nasazen na tiskové hlavě. Pokud ne, vyjměte jej ze slotu %s v zásobníku, nasaďte na hlavu a přesuňte ji do středu podložky.'
  00x1A00E00000010005: 'Zásobník indukčních hotendů je během navádění blokován překážkou. Odstraňte prosím všechny překážky z jeho dráhy pohybu.'
  00x1A00E00000010006: 'Dráha navádění zásobníku indukčních hotendů je příliš dlouhá. Rozvodový řemen může být uvolněný. Zkontrolujte jej a napněte.'
